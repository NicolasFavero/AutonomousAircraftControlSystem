; ============================================================
; U-BLOX GPS CONFIG TOOL -- platformio.ini (ESP32-S3)
; ============================================================
; Ferramenta de diagnostico/configuracao interativa para
; receptores GPS u-blox (via UBX binario), rodando em ESP32-S3.
;
; Ajuste os pinos de ligacao com o GPS em src/main.cpp
; (constantes GPS_RX / GPS_TX), nao aqui.
; ============================================================

[env:esp32-s3-devkitm-1]
platform = https://github.com/pioarduino/platform-espressif32.git
board = esp32-s3-devkitc-1
framework = arduino

; Configurações específicas de Flash, PSRAM e Partiçoes do ESP32-S3 Super Mini (FH4R2)
board_upload.flash_size = 4MB
board_build.partitions = default.csv
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio

; Configurações da Serial e Monitor
monitor_speed = 115200
monitor_eol = LF

; Flags essenciais para habilitar o USB Serial Nativo do ESP32-S3
build_flags = 
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D HW_CDC_BUF_SIZE=1024
    -D ARDUINO_USB_MSC_ON_BOOT=0
    -D ARDUINO_USB_DFU_ON_BOOT=0
    -D BOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -O2
    -Iinclude

build_type = release